
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name VORQELI-Connect --paths src build_entry.py

      - name: Upload EXE
        uses: actions/upload-artifact@v6
        with:
          name: VORQELI-Connect-Windows
          path: dist/VORQELI-Connect.exe
          if-no-files-found: error
