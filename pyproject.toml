[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vorqeli-connect"
version = "0.10.0"
description = "Windows network connectivity control desktop app"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
vorqeli-connect = "vorqeli_connect.app:main"

[tool.setuptools.packages.find]
where = ["src"]
