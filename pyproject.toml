[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vorqeli-connect"
version = "0.35.0"
description = "Windows network connectivity control desktop app"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "pystray>=0.19,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
vorqeli-connect = "vorqeli_connect.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vorqeli_connect = ["Flowseal-zapret-1.10.3-LICENSE.txt"]
